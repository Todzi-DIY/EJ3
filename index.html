<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERTĖJAS - DIAGNOSTIKA</title>
<style>
  body { background: #111; color: #fff; font-family: Arial, sans-serif; padding: 20px; margin: 0; }
  h1 { color: #4CAF50; text-align: center; }
  .btn { display: block; width: 100%; max-width: 320px; margin: 20px auto; padding: 20px;
         font-size: 18px; font-weight: bold; color: white; background: #4CAF50;
         border: none; border-radius: 8px; cursor: pointer; }
  .btn:active { background: #388E3C; }
  #result { margin-top: 20px; padding: 15px; background: #1a1a1a; border: 1px solid #333;
            border-radius: 8px; white-space: pre-wrap; word-break: break-word;
            font-family: monospace; font-size: 12px; min-height: 100px; }
  .info { color: #FFC107; text-align: center; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>

<h1>🔍 DIAGNOSTIKA</h1>

<div class="info">Pasirinkite nuotrauką – klaida bus parodyta iššokančiame lange</div>

<input type="file" id="fileInput" accept="image/*" style="display:none;">

<button class="btn" id="selectBtn">📁 PASIRINKTI NUOTRAUKĄ</button>

<div id="result">Rezultatas pasirodys čia...</div>

<script>
  // ============================================================
  // KONFIGŪRACIJA
  // ============================================================
  const WORKER_URL = 'https://deepl-proxy.t-jasukaitis.workers.dev';

  // ============================================================
  // MYGTUKO PASPAUDIMAS
  // ============================================================
  document.getElementById('selectBtn').addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });

  // ============================================================
  // FAILO PASIRINKIMAS
  // ============================================================
  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById('result').innerText = "Apdorojama...";
    alert("1. Pradėta apdoroti\n\nFailas: " + file.name + "\nDydis: " + Math.round(file.size/1024) + " KB");

    try {
      // ============================================================
      // 1. NUSKAITOME NUOTRAUKĄ
      // ============================================================
      const img = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = () => reject(new Error("Nepavyko įkelti nuotraukos"));
          i.src = ev.target.result;
        };
        reader.onerror = () => reject(new Error("Nepavyko perskaityti failo"));
        reader.readAsDataURL(file);
      });

      // ============================================================
      // 2. SUMAŽINAME IR PARUOŠIAME BASE64
      // ============================================================
      const canvas = document.createElement('canvas');
      let w = img.width;
      let h = img.height;
      const maxDim = 1600;
      if (w > maxDim || h > maxDim) {
        const ratio = Math.min(maxDim / w, maxDim / h);
        w = Math.floor(w * ratio);
        h = Math.floor(h * ratio);
      }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      const base64Image = canvas.toDataURL("image/jpeg", 0.85).split(',')[1];

      // ============================================================
      // 3. SIUNČIAME UŽKLAUSĄ Į WORKER
      // ============================================================
      const requestBody = JSON.stringify({
        requests: [{
          image: { content: base64Image },
          features: [{ type: "DOCUMENT_TEXT_DETECTION" }]
        }]
      });

      alert("2. Siunčiama į Worker\n\nURL: " + WORKER_URL + "/vision\nBody dydis: " + requestBody.length + " simbolių");

      const res = await fetch(WORKER_URL + '/vision', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: requestBody
      });

      alert("3. Worker atsakymas gautas\n\nHTTP Status: " + res.status + "\nStatus Text: " + res.statusText);

      // ============================================================
      // 4. NUSKAITOME ATSAKYMĄ
      // ============================================================
      const rawText = await res.text();
      
      alert("4. Atsakymo turinys (pirma 1500 simbolių):\n\n" + rawText.substring(0, 1500));

      // ============================================================
      // 5. RODOME REZULTATĄ PUSLAPYJE
      // ============================================================
      let displayText = "=== HTTP STATUS ===\n" + res.status + " " + res.statusText + "\n\n";
      displayText += "=== ATSAKYMAS ===\n";
      
      try {
        const parsed = JSON.parse(rawText);
        displayText += JSON.stringify(parsed, null, 2);
        
        // Jei yra tekstas - parodykime jį
        if (parsed.responses && parsed.responses[0] && parsed.responses[0].fullTextAnnotation) {
          displayText += "\n\n=== NUSKAITYTAS TEKSTAS ===\n";
          displayText += parsed.responses[0].fullTextAnnotation.text;
        }
      } catch (e) {
        displayText += rawText;
      }

      document.getElementById('result').innerText = displayText;

    } catch (err) {
      alert("❌ KLAIDA:\n\n" + err.name + ": " + err.message);
      document.getElementById('result').innerText = "❌ KLAIDA:\n\n" + err.name + ": " + err.message + "\n\n" + (err.stack || "");
    }
  });

</script>
</body>
</html>
